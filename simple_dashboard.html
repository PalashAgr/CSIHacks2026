<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico Security System Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
        .card .unit {
            font-size: 18px;
            color: #666;
        }
        .status {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
        }
        .status.armed {
            background: #ff6b6b;
            color: white;
        }
        .status.disarmed {
            background: #51cf66;
            color: white;
        }
        .status.alarm {
            background: #ff0000;
            color: white;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.5; }
        }
        .camera {
            width: 100%;
            max-width: 640px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #764ba2;
        }
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        .add-person {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .add-person h3 {
            margin: 0 0 15px 0;
            color: #555;
        }
        .add-person input {
            margin: 10px 5px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .add-person input[type="text"] {
            width: 200px;
        }
        #addStatus {
            margin-top: 10px;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Pico Security System Dashboard</h1>
        
        <div class="grid">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="temp">--</div>
                <div class="unit">°C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humidity">--</div>
                <div class="unit">%</div>
            </div>
            <div class="card">
                <h3>Distance</h3>
                <div class="value" id="distance">--</div>
                <div class="unit">cm</div>
            </div>
            <div class="card">
                <h3>System Status</h3>
                <div class="status disarmed" id="status">DISARMED</div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="toggleArm()">Toggle Arm/Disarm</button>
            <button onclick="triggerAlarm()">Test Alarm</button>
        </div>
        
        <div class="add-person">
            <h3>Add Person to Database</h3>
            <input type="text" id="personName" placeholder="Enter name" />
            <input type="file" id="personImage" accept="image/*" />
            <button onclick="addPerson()">Add Person</button>
            <div id="addStatus"></div>
        </div>
        
        <img class="camera" id="camera" src="/api/frame.jpg" alt="Camera Feed">
        
        <div class="last-updated">
            Last updated: <span id="updated">--</span>
        </div>
    </div>

    <script>
        function updateData() {
            fetch('/api/state')
                .then(response => response.json())
                .then(data => {
                    // Update sensor values - try pico first, then environment
                    const temp = data.pico?.temperature_c ?? data.environment?.room_temperature_c;
                    const humidity = data.pico?.humidity ?? data.environment?.room_humidity;
                    const distance = data.pico?.distance_cm;
                    
                    document.getElementById('temp').textContent = temp !== null ? temp.toFixed(1) : '--';
                    document.getElementById('humidity').textContent = humidity !== null ? humidity.toFixed(0) : '--';
                    document.getElementById('distance').textContent = distance !== null ? distance.toFixed(1) : '--';
                    
                    // Update status
                    const statusEl = document.getElementById('status');
                    if (data.pico?.alarm || data.alarm?.active) {
                        statusEl.textContent = 'ALARM ACTIVE';
                        statusEl.className = 'status alarm';
                    } else if (data.pico?.armed) {
                        statusEl.textContent = 'ARMED';
                        statusEl.className = 'status armed';
                    } else {
                        statusEl.textContent = 'DISARMED';
                        statusEl.className = 'status disarmed';
                    }
                    
                    // Update timestamp
                    document.getElementById('updated').textContent = new Date().toLocaleTimeString();
                    
                    // Update camera with cache busting
                    document.getElementById('camera').src = '/api/frame.jpg?' + new Date().getTime();
                })
                .catch(err => console.error('Error fetching data:', err));
        }
        
        function toggleArm() {
            const currentState = document.getElementById('status').textContent;
            const shouldArm = currentState === 'DISARMED';
            
            fetch('/api/arm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ armed: shouldArm })
            }).then(() => {
                // If arming, also trigger alarm sound to confirm
                if (shouldArm) {
                    console.log('Arming - triggering buzzer confirmation');
                    fetch('/api/alarm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ enabled: true })
                    }).then(() => {
                        console.log('Buzzer on - waiting 1 second');
                        setTimeout(() => {
                            console.log('Turning buzzer off');
                            fetch('/api/alarm', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ enabled: false })
                            });
                        }, 1000);
                    });
                }
                updateData();
            });
        }
        
        function triggerAlarm() {
            fetch('/api/alarm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: true })
            }).then(() => updateData());
        }
        
        function addPerson() {
            const name = document.getElementById('personName').value;
            const imageInput = document.getElementById('personImage');
            const statusDiv = document.getElementById('addStatus');
            
            if (!name || !imageInput.files[0]) {
                statusDiv.textContent = 'Please enter a name and select an image';
                statusDiv.className = 'error';
                return;
            }
            
            statusDiv.textContent = 'Adding person...';
            statusDiv.className = '';
            
            // Convert image to base64
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                
                fetch('/api/people/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        image: base64Image
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        statusDiv.textContent = `Successfully added ${name} to database!`;
                        statusDiv.className = 'success';
                        document.getElementById('personName').value = '';
                        imageInput.value = '';
                    } else {
                        statusDiv.textContent = `Error: ${data.error}`;
                        statusDiv.className = 'error';
                    }
                })
                .catch(err => {
                    statusDiv.textContent = `Error: ${err.message}`;
                    statusDiv.className = 'error';
                });
            };
            reader.readAsDataURL(imageInput.files[0]);
        }
        
        // Update data every second
        updateData();
        setInterval(updateData, 1000);
    </script>
</body>
</html>
